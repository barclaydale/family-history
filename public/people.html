<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All people · Mueller Family History</title>
<meta name="description" content="Everyone recorded in the Mueller family history, with dates, generation, and what the archive holds for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/person.css">
</head>
<body data-page="people">
<header id="site-header" class="site-header"></header>

<main>
  <div class="wrap page-head">
    <p class="eyebrow">The whole record</p>
    <h1>All people</h1>
    <p class="lede">Everyone transcribed from the family tree chart and the narrative pages of the
    history — <span id="people-count"></span> in all.</p>

    <div class="tree-toolbar" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 18px">
      <input type="search" id="people-search" placeholder="Search names…" autocomplete="off" aria-label="Search names" style="flex:1 1 220px">
      <select id="people-gen" aria-label="Filter by generation">
        <option value="">All generations</option>
        <option value="1">Generation 1</option>
        <option value="2">Generation 2</option>
        <option value="3">Generation 3</option>
        <option value="4">Generation 4</option>
        <option value="5">Generation 5</option>
      </select>
      <select id="people-sort" aria-label="Sort by">
        <option value="birth">Sort by birth year</option>
        <option value="name">Sort by name</option>
      </select>
    </div>

    <table class="people-table">
      <thead><tr><th>Name</th><th>Born</th><th>Died</th><th>Gen.</th><th>Stories</th><th>Places</th></tr></thead>
      <tbody id="people-body"></tbody>
    </table>
    <hr class="rule-orn">
  </div>
</main>

<footer id="site-footer"></footer>

<script src="data/people.js"></script>
<script src="data/places.js"></script>
<script src="data/stories.js"></script>
<script src="data/photos.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/people.js"></script>
</body>
</html>
